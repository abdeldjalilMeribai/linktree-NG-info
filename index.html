<style>
:root{--ink:#060506;--red:#ff1414;--bone:#f5f1f0;--mute:#a79c9c;--line:rgba(255,255,255,.09);--head:"Exo 2","Segoe UI",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html{background:var(--ink);color-scheme:dark;-webkit-text-size-adjust:100%}
body{min-height:100dvh;font:500 16px/1.5 var(--body);color:var(--bone);background:radial-gradient(70% 38% at 50% 0,rgba(255,20,20,.16),transparent 70%),var(--ink)}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.stage{width:min(100%,460px);min-height:100dvh;margin-inline:auto;position:relative;overflow:hidden}
@media(min-width:600px){.stage{border-inline:1px solid rgba(255,20,20,.22);box-shadow:0 0 120px -20px rgba(255,20,20,.4)}}
.hero{position:relative;aspect-ratio:3/2}
.hero::after{content:"";position:absolute;inset:0 0 auto;height:120px;background:linear-gradient(rgba(6,5,6,.8),transparent);pointer-events:none}
.hero img{display:block;width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent);animation:on 1.4s ease-out both}
.brand{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 18px);left:20px;width:clamp(88px,26vw,110px);animation:rise .9s .5s cubic-bezier(.2,.8,.2,1) both}
.brand img{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.8)) drop-shadow(0 0 14px rgba(255,20,20,.35))}
.intro{position:relative;margin-top:-18px;padding:0 24px 6px;text-align:center}
h1{font:italic 800 clamp(24px,7vw,30px)/1.1 var(--head);letter-spacing:-.01em;text-wrap:balance}
.intro p{margin-top:10px;color:var(--mute);font-size:15px}
.links{list-style:none;padding:20px 18px 8px;display:grid;gap:12px}
.link{--x:50%;--y:50%;position:relative;isolation:isolate;display:grid;grid-template-columns:48px 1fr 18px;align-items:center;gap:14px;min-height:68px;padding:10px 16px 10px 10px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.02));color:inherit;text-decoration:none;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .2s,border-color .2s}
.link::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(180px circle at var(--x) var(--y),rgba(255,30,30,.32),transparent 70%);transition:opacity .25s}
.link:hover,.link:active{border-color:rgba(255,40,40,.55)}
.link:hover::before,.link:active::before{opacity:1}
.link:active{transform:scale(.985)}
.link:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ico{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:#000;border:1px solid rgba(255,40,40,.35);color:var(--red)}
.ico svg,.chev{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chev{width:18px;height:18px;color:var(--mute)}
.t{display:block;font:italic 700 17px/1.2 var(--head)}
.s{display:block;margin-top:3px;text-wrap:balance;font-size:13px;color:var(--mute)}
.ico svg.wa{width:24px;height:24px;stroke:none}
footer{padding:22px 24px calc(28px + env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--mute)}
@keyframes on{0%{opacity:0;filter:brightness(.3)}25%{opacity:.7}35%{opacity:.2}55%{opacity:1;filter:brightness(1.4)}100%{opacity:1;filter:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,::before{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(() => {
  'use strict';
  const ALLOWED = new Set(['https:', 'tel:', 'mailto:']);
  document.querySelectorAll('a[href]').forEach((a) => {
    let u;
    try { u = new URL(a.getAttribute('href'), location.href); } catch (e) { a.removeAttribute('href'); return; }
    if (!ALLOWED.has(u.protocol)) { a.removeAttribute('href'); return; }
    if (u.protocol === 'https:') { a.target = '_blank'; a.rel = 'noopener noreferrer nofollow'; }
  });
  const glow = (el, e) => {
    const r = el.getBoundingClientRect();
    el.style.setProperty('--x', (e.clientX - r.left) + 'px');
    el.style.setProperty('--y', (e.clientY - r.top) + 'px');
  };
  document.querySelectorAll('.link').forEach((el) => {
    ['pointermove', 'pointerdown'].forEach((t) => el.addEventListener(t, (e) => glow(el, e), { passive: true }));
  });
})();
</script>
